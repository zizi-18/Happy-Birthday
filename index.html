<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love</title>

<style>
/* --- CONFIGURACIÓN BÁSICA --- */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background-color: #ffd6e8; /* Rosa claro */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* --- BOTÓN DE INICIO (ESTILO GIGANTE) --- */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffd6e8;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

button {
  padding: 20px 40px;
  font-size: 24px;
  background: #c2185b;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  animation: latido 1s infinite;
}

@keyframes latido {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* --- ESCENARIO DE LA TARTA --- */
.container {
  display: none; /* Se oculta hasta que pulsas el botón */
  position: relative;
  text-align: center;
  width: 100%;
  height: 100%;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* --- BRILLOS --- */
.sparkle {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px white;
  opacity: 0;
  animation: flotar 5s linear infinite;
}

@keyframes flotar {
  0% { transform: translateY(100vh); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* --- LA TARTA --- */
.cake-wrapper {
  position: relative;
  width: 300px;
  height: 350px; /* Altura total de la tarta */
  margin: 0 auto;
}

.plate {
  width: 300px;
  height: 30px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  position: absolute;
  bottom: 0;
  left: 0;
}

/* Estilos comunes de capas */
.layer, .filling, .cream-top {
  position: absolute;
  left: 25px; /* Centrado respecto al plato de 300px (300-250)/2 */
  width: 250px;
  opacity: 0; /* Invisible al inicio */
}

/* Capa Marrón */
.layer {
  height: 50px;
  background: linear-gradient(to right, #6b3a17, #4a260f);
  border-radius: 10px;
  z-index: 5;
}

/* Relleno Chocolate */
.filling {
  height: 15px;
  width: 240px; /* Un poco más metido */
  left: 30px;
  background: #2a140a;
  border-radius: 5px;
  z-index: 4;
}

/* Crema Blanca Arriba */
.cream-top {
  height: 40px;
  background: linear-gradient(to bottom, #ffffff, #f0f0f0);
  border-radius: 15px 15px 10px 10px;
  z-index: 10;
  box-shadow: 0 5px 5px rgba(0,0,0,0.1);
}

/* --- POSICIONES Y ANIMACIONES --- */
/* Animación de entrada */
@keyframes caer {
  from { transform: translateY(-300px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Definimos las posiciones exactas desde abajo (bottom) */
#base1 { bottom: 20px; animation: caer 0.5s forwards 0.5s; } /* Marron */
#relleno1 { bottom: 65px; animation: caer 0.5s forwards 1.0s; } /* Choco */
#base2 { bottom: 75px; animation: caer 0.5s forwards 1.5s; } /* Marron */
#relleno2 { bottom: 120px; animation: caer 0.5s forwards 2.0s; } /* Choco */
#base3 { bottom: 130px; animation: caer 0.5s forwards 2.5s; } /* Marron */
#crema { bottom: 175px; animation: caer 0.5s forwards 3.0s; } /* Blanca */

/* --- VELA --- */
.candle {
  position: absolute;
  left: 143px; /* Centro */
  bottom: 210px;
  width: 14px;
  height: 50px;
  background: repeating-linear-gradient(45deg, white, white 5px, #ffb6c1 5px, #ffb6c1 10px);
  z-index: 1;
  opacity: 0;
  animation: subir 1s forwards 3.5s;
}

.flame {
  position: absolute;
  top: -20px;
  left: -1px;
  width: 16px;
  height: 20px;
  background: radial-gradient(circle, yellow, orange, red);
  border-radius: 50%;
  animation: fuego 0.3s infinite alternate;
}

@keyframes subir { to { opacity: 1; } }
@keyframes fuego { to { transform: scale(1.2); } }

/* --- TEXTO --- */
.message {
  margin-top: 50px;
  font-size: 28px;
  font-weight: bold;
  color: #c2185b;
  min-height: 40px;
}

</style>
</head>
<body>

<div id="overlay">
  <button onclick="empezarFiesta()">🎁 ABRIR REGALO 🎁</button>
  <p style="margin-top:20px; color: #888;">(Sube el volumen 🔊)</p>
</div>

<audio id="player" loop>
  <source src="mucia.mp3" type="audio/mpeg">
</audio>

<div class="container" id="fiesta">
  
  <div class="cake-wrapper">
    <div class="plate"></div>

    <div id="base1" class="layer"></div>
    <div id="relleno1" class="filling"></div>
    
    <div id="base2" class="layer"></div>
    <div id="relleno2" class="filling"></div>
    
    <div id="base3" class="layer"></div>
    
    <div id="crema" class="cream-top"></div>

    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <div class="message" id="texto"></div>

</div>

<script>
function empezarFiesta() {
  var audio = document.getElementById("player");
  var overlay = document.getElementById("overlay");
  var fiesta = document.getElementById("fiesta");

  // 1. Intentar reproducir audio con control de errores
  audio.play().then(function() {
    // Si funciona:
    overlay.style.display = "none";
    fiesta.style.display = "flex";
    iniciarEfectos();
  }).catch(function(error) {
    // Si falla:
    alert("Error de audio: " + error + ". Comprueba que el archivo se llame mucia.mp3");
    // Aun así mostramos la animación
    overlay.style.display = "none";
    fiesta.style.display = "flex";
    iniciarEfectos();
  });
}

function iniciarEfectos() {
  // Brillos
  setInterval(function() {
    var b = document.createElement("div");
    b.className = "sparkle";
    b.style.left = Math.random() * 100 + "%";
    b.style.width = (Math.random() * 5 + 2) + "px";
    b.style.height = b.style.width;
    document.body.appendChild(b);
    setTimeout(function(){ b.remove() }, 5000);
  }, 300);

  // Texto
  var msg = "Happy birthday my love!";
  var i = 0;
  var txtDiv = document.getElementById("texto");
  // Empieza a escribir a los 3 segundos (cuando la tarta está casi lista)
  setTimeout(function() {
    var intervalo = setInterval(function() {
      if (i < msg.length) {
        txtDiv.innerHTML += msg.charAt(i);
        i++;
      } else {
        clearInterval(intervalo);
      }
    }, 100);
  }, 3000);
}
</script>

</body>
</html>
