<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love</title>

<style>
/* 1. ESTILOS GENERALES */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background-color: #ffd6e8; /* Rosa claro */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* 2. PANTALLA DE INICIO (Para que funcione el audio) */
#pantalla-inicio {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255, 214, 232, 0.98);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 1000;
  cursor: pointer;
}

#pantalla-inicio h1 {
  color: #c2185b;
  font-size: 2rem;
  animation: palpitar 1.5s infinite;
}

@keyframes palpitar {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* 3. BRILLOS EN EL AIRE */
.sparkle {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
  opacity: 0;
  pointer-events: none;
  animation: flotar linear infinite;
}

@keyframes flotar {
  0% { transform: translateY(110vh) scale(0); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh) scale(0); opacity: 0; }
}

/* 4. CONTENEDOR TARTA (Se oculta al principio) */
.cake-container {
  display: none; /* Se activa con JS */
  position: relative;
  width: 300px;
  height: 400px;
  flex-direction: column-reverse;
  align-items: center;
  padding-bottom: 20px;
}

/* 5. PLATO Y TARTA */
.plate {
  width: 320px;
  height: 40px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 10px 15px rgba(0,0,0,0.2);
  position: absolute;
  bottom: 0;
  z-index: 1;
}

.cake-element {
  opacity: 0;
  animation: caer 0.8s forwards;
}

/* Capas Marrones (Iguales) */
.layer {
  width: 250px;
  height: 50px;
  background: linear-gradient(to right, #6d4c41, #5d4037, #4e342e);
  border-radius: 10px;
  position: relative;
  z-index: 5;
  margin-bottom: -10px;
  box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
}

/* Relleno Chocolate */
.filling {
  width: 240px;
  height: 15px;
  background: #3e2723;
  border-radius: 5px;
  margin: -2px 0;
  z-index: 4;
}

/* Crema Blanca Superior */
.frosting {
  width: 250px;
  height: 40px;
  background: linear-gradient(to bottom, #ffffff, #f0f0f0);
  border-radius: 15px 15px 10px 10px;
  z-index: 10;
  position: relative;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

/* Vela */
.candle {
  width: 14px;
  height: 60px;
  background: repeating-linear-gradient(45deg, #ff9a9e, #ff9a9e 5px, #fff 5px, #fff 10px);
  border-radius: 4px;
  position: absolute;
  bottom: 230px;
  z-index: 2;
  opacity: 0;
  animation: subir 1s forwards;
}

.flame {
  width: 16px;
  height: 26px;
  background: radial-gradient(circle at 50% 80%, #fff000, #ff9900, #ff0000);
  border-radius: 50% 50% 20% 20%;
  position: absolute;
  top: -26px;
  left: -1px;
  box-shadow: 0 0 20px #ff9900;
  animation: fuego 0.3s infinite alternate;
}

/* Animaciones */
@keyframes caer {
  0% { transform: translateY(-300px); opacity: 0; }
  60% { transform: translateY(10px); opacity: 1; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes subir {
  0% { transform: translateY(50px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}
@keyframes fuego {
  0% { transform: scale(1); opacity: 0.9; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* Tiempos de aparición */
.pos1 { animation-delay: 0.5s; z-index: 2; bottom: 20px; position: absolute;} /* Capa 1 */
.pos2 { animation-delay: 1.0s; z-index: 3; bottom: 60px; position: absolute;} /* Relleno */
.pos3 { animation-delay: 1.5s; z-index: 4; bottom: 70px; position: absolute;} /* Capa 2 */
.pos4 { animation-delay: 2.0s; z-index: 5; bottom: 110px; position: absolute;} /* Relleno */
.pos5 { animation-delay: 2.5s; z-index: 6; bottom: 120px; position: absolute;} /* Capa 3 */
.pos6 { animation-delay: 3.0s; z-index: 7; bottom: 160px; position: absolute;} /* Crema blanca */
.candle { animation-delay: 3.8s; z-index: 1; bottom: 190px; position: absolute;}

/* 6. TEXTO */
.message {
  margin-top: 40px;
  font-size: 32px;
  font-weight: bold;
  color: #c2185b;
  text-transform: uppercase;
  letter-spacing: 2px;
  min-height: 50px;
  text-align: center;
  opacity: 0;
  transition: opacity 1s;
}
</style>
</head>
<body>

<div id="pantalla-inicio">
  <h1>🎁 Haz clic para ver tu sorpresa 🎁</h1>
  <p>(Dale clic para que suene la música 🎵)</p>
</div>

<audio id="musica" loop>
  <source src="mucia.mp3" type="audio/mpeg">
</audio>

<div class="cake-container" id="escenario">
  <div class="plate"></div>
  
  <div class="cake-element layer pos1"></div>
  <div class="cake-element filling pos2"></div>
  <div class="cake-element layer pos3"></div>
  <div class="cake-element filling pos4"></div>
  <div class="cake-element layer pos5"></div>
  <div class="cake-element frosting pos6"></div> <div class="candle">
    <div class="flame"></div>
  </div>
</div>

<div class="message" id="texto"></div>

<script>
// Referencias
const pantalla = document.getElementById('pantalla-inicio');
const audio = document.getElementById('musica');
const escenario = document.getElementById('escenario');
const textoDiv = document.getElementById('texto');

// AL HACER CLIC
pantalla.addEventListener('click', () => {
  pantalla.style.display = 'none'; // Quitar pantalla inicio
  audio.play();                    // Sonar música
  escenario.style.display = 'flex'; // Mostrar tarta
  textoDiv.style.opacity = '1';     // Preparar texto
  
  iniciarEfectos();                 // Lanzar brillos y letras
});

function iniciarEfectos() {
  // Brillos
  setInterval(() => {
    let chispa = document.createElement('div');
    chispa.classList.add('sparkle');
    chispa.style.left = Math.random() * 100 + 'vw';
    chispa.style.width = (Math.random() * 5 + 2) + 'px';
    chispa.style.height = chispa.style.width;
    chispa.style.animationDuration = (Math.random() * 3 + 4) + 's';
    document.body.appendChild(chispa);
    setTimeout(() => chispa.remove(), 7000);
  }, 200);

  // Texto letra a letra (Empieza a los 2.5s)
  const mensaje = "Happy birthday my love!";
  let i = 0;
  setTimeout(() => {
    let intervalo = setInterval(() => {
      if (i < mensaje.length) {
        textoDiv.innerHTML += mensaje.charAt(i);
        i++;
      } else {
        clearInterval(intervalo);
      }
    }, 100);
  }, 2500);
}
</script>

</body>
</html>
