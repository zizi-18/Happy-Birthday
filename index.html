<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love</title>

<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: #ffd6e8;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* ✨ Partículas brillantes */
.sparkle {
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px white;
  animation: float 8s linear infinite;
  opacity: 0;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

.container {
  text-align: center;
  position: relative;
}

/* 🍽️ Plato */
.plate {
  width: 280px;
  height: 25px;
  background: white;
  border-radius: 50%;
  margin: auto;
  box-shadow: 0 8px 20px rgba(0,0,0,0.2);
}

/* 🎂 Tarta */
.cake {
  position: relative;
  width: 240px;
  margin: auto;
}

.layer {
  height: 55px;
  margin: 0 auto;
  border-radius: 10px;
  background: #5a2d0c; /* marrón */
  transform: translateY(200px);
  opacity: 0;
  animation: build 0.8s forwards;
}

.choco-cream {
  height: 15px;
  margin: 0 auto;
  border-radius: 8px;
  background: #3b1f0f; /* chocolate oscuro */
  transform: translateY(200px);
  opacity: 0;
  animation: build 0.8s forwards;
}

.top-cream {
  height: 25px;
  margin: 0 auto;
  border-radius: 15px;
  background: white;
  transform: translateY(200px);
  opacity: 0;
  animation: build 0.8s forwards;
}

/* Tamaños y tiempos */
.layer1 { width: 240px; animation-delay: 0.5s; }
.cream1 { width: 220px; animation-delay: 1.2s; }
.layer2 { width: 200px; animation-delay: 1.9s; }
.cream2 { width: 180px; animation-delay: 2.6s; }
.layer3 { width: 160px; animation-delay: 3.3s; }
.top-cream { width: 160px; animation-delay: 4s; }

@keyframes build {
  to {
    transform: translateY(0);
    opacity: 1;
  }
}

/* 🕯️ Vela */
.candle {
  width: 10px;
  height: 45px;
  background: white;
  position: absolute;
  top: -55px;
  left: 50%;
  transform: translateX(-50%) translateY(200px);
  opacity: 0;
  animation: build 0.8s forwards 4.7s;
}

.flame {
  width: 14px;
  height: 14px;
  background: orange;
  border-radius: 50%;
  position: absolute;
  top: -14px;
  left: -2px;
  animation: flicker 0.4s infinite alternate;
  box-shadow: 0 0 15px orange;
}

@keyframes flicker {
  from { transform: scale(1); opacity: 0.8; }
  to { transform: scale(1.3); opacity: 1; }
}

/* ✍️ Texto */
.message {
  margin-top: 40px;
  font-size: 28px;
  font-weight: bold;
  color: #c2185b;
  min-height: 40px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<div class="container">

  <div class="cake">
    <div class="layer layer1"></div>
    <div class="choco-cream cream1"></div>
    <div class="layer layer2"></div>
    <div class="choco-cream cream2"></div>
    <div class="layer layer3"></div>
    <div class="top-cream"></div>

    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <div class="plate"></div>

  <div class="message" id="text"></div>

</div>

<script>

/* ✨ Partículas */
function createSparkle() {
  const sparkle = document.createElement("div");
  sparkle.classList.add("sparkle");
  sparkle.style.left = Math.random() * 100 + "vw";
  sparkle.style.animationDuration = (Math.random() * 5 + 5) + "s";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 8000);
}
setInterval(createSparkle, 300);

/* ✍️ Texto letra por letra */
const message = "Happy birthday my love!";
const textElement = document.getElementById("text");
let index = 0;

function typeWriter() {
  if (index < message.length) {
    textElement.innerHTML += message.charAt(index);
    index++;
    setTimeout(typeWriter, 90);
  }
}

setTimeout(typeWriter, 800);

</script>

</body>
</html>
