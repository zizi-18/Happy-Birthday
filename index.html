<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love</title>

<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background: #ffd6e8;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* ✨ Brillos */
.sparkle {
  position: absolute;
  width: 5px;
  height: 5px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 15px white;
  animation: float 8s linear infinite;
  opacity: 0;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 0; }
  20% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

.container {
  text-align: center;
  position: relative;
}

/* 🍽️ Plato */
.plate {
  width: 300px;
  height: 30px;
  background: white;
  border-radius: 50%;
  margin: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.25);
}

/* 🎂 Tarta */
.cake {
  position: relative;
  width: 260px;
  margin: auto;
}

.layer, .cream-choco, .cream-top {
  width: 260px;
  margin: 0 auto;
  transform: translateY(200px);
  opacity: 0;
  animation: rise 0.8s forwards;
}

.layer {
  height: 60px;
  border-radius: 12px;
  background: linear-gradient(to bottom, #6b3a17, #4a260f);
  box-shadow: inset 0 6px 10px rgba(255,255,255,0.2),
              inset 0 -8px 12px rgba(0,0,0,0.4);
}

.cream-choco {
  height: 18px;
  border-radius: 8px;
  background: linear-gradient(to bottom, #3b1f0f, #2a140a);
}

.cream-top {
  height: 30px;
  border-radius: 20px 20px 15px 15px;
  background: linear-gradient(to bottom, #ffffff, #f0f0f0);
  box-shadow: inset 0 -5px 8px rgba(0,0,0,0.1);
}

/* ORDEN DESDE ABAJO */
.layer1 { animation-delay: 0.5s; }
.cream1 { animation-delay: 1.2s; }
.layer2 { animation-delay: 1.9s; }
.cream2 { animation-delay: 2.6s; }
.layer3 { animation-delay: 3.3s; }
.cream-top { animation-delay: 4s; }

@keyframes rise {
  0% { transform: translateY(200px); opacity: 0; }
  70% { transform: translateY(-10px); opacity: 1; }
  100% { transform: translateY(0); }
}

/* 🕯️ Vela */
.candle {
  width: 12px;
  height: 50px;
  background: repeating-linear-gradient(
    45deg,
    white,
    white 5px,
    #ffb6c1 5px,
    #ffb6c1 10px
  );
  position: absolute;
  top: -65px;
  left: 50%;
  transform: translateX(-50%) translateY(200px);
  opacity: 0;
  animation: rise 0.8s forwards 4.7s;
  border-radius: 4px;
}

.flame {
  width: 16px;
  height: 20px;
  background: radial-gradient(circle, yellow 20%, orange 60%, red 100%);
  border-radius: 50%;
  position: absolute;
  top: -20px;
  left: -2px;
  animation: flicker 0.3s infinite alternate;
  box-shadow: 0 0 20px orange;
}

@keyframes flicker {
  from { transform: scale(1); }
  to { transform: scale(1.25); }
}

/* ✍️ Texto */
.message {
  margin-top: 50px;
  font-size: 30px;
  font-weight: bold;
  color: #c2185b;
  min-height: 40px;
  letter-spacing: 2px;
}
</style>
</head>

<body>

<!-- 🎵 Música -->
<audio autoplay loop>
  <source src="mucia.mp3" type="audio/mpeg">
</audio>

<div class="container">

  <div class="cake">
    <!-- DESDE ABAJO HACIA ARRIBA -->
    <div class="layer layer1"></div>
    <div class="cream-choco cream1"></div>
    <div class="layer layer2"></div>
    <div class="cream-choco cream2"></div>
    <div class="layer layer3"></div>
    <div class="cream-top"></div>

    <div class="candle">
      <div class="flame"></div>
    </div>
  </div>

  <div class="plate"></div>

  <div class="message" id="text"></div>

</div>

<script>

/* ✨ Brillos */
function createSparkle() {
  const sparkle = document.createElement("div");
  sparkle.classList.add("sparkle");
  sparkle.style.left = Math.random() * 100 + "vw";
  sparkle.style.animationDuration = (Math.random() * 6 + 6) + "s";
  document.body.appendChild(sparkle);
  setTimeout(() => sparkle.remove(), 8000);
}
setInterval(createSparkle, 250);

/* ✍️ Texto letra por letra */
const message = "Happy birthday my love!";
const textElement = document.getElementById("text");
let index = 0;

function typeWriter() {
  if (index < message.length) {
    textElement.innerHTML += message.charAt(index);
    index++;
    setTimeout(typeWriter, 90);
  }
}

setTimeout(typeWriter, 800);

</script>

</body>
</html>
