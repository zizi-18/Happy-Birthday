<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap');

body {
  margin: 0;
  padding: 0;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow: hidden;
  font-family: 'Great Vibes', cursive;
}

.container {
  text-align: center;
}

.Happy__Birthday {
  color: #c2185b;
  font-size: 4em;
  font-weight: 700;
  text-shadow: 2px 2px 8px rgba(255, 255, 255, 0.7);
  animation: glow 2s ease-in-out infinite alternate;
}

.message {
  font-size: 2em;
  color: white;
  margin-top: 20px;
}

@keyframes glow {
  from {
    text-shadow: 0 0 10px #fff, 0 0 20px #ff4081, 0 0 30px #ff4081;
  }
  to {
    text-shadow: 0 0 20px #fff, 0 0 40px #f50057, 0 0 60px #f50057;
  }
}

/* Corazones animados */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.8);
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% {
    transform: translateY(100vh) scale(1);
    opacity: 1;
  }
  100% {
    transform: translateY(-10vh) scale(1.5);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="Happy__Birthday">Happy Birthday!</div>
  <div class="message">Mi amor, que este día sea tan hermoso como tú ❤️</div>
</div>

<script>
// Crear corazones flotando
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
