<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy Birthday</title>

<style>
/* --- ESTILOS BÁSICOS --- */
body {
  margin: 0;
  padding: 0;
  width: 100vw;
  height: 100vh;
  background-color: #ffd6e8; /* Rosa suave */
  overflow: hidden; /* Evita barras de desplazamiento */
  font-family: sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* --- PANTALLA DE INICIO (BOTÓN) --- */
#pantalla-inicio {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #ffd6e8;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

button {
  background: #e91e63;
  color: white;
  border: none;
  padding: 20px 40px;
  font-size: 20px;
  border-radius: 50px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  cursor: pointer;
  animation: palpitar 1s infinite;
}

@keyframes palpitar {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* --- ESCENARIO DE LA TARTA --- */
#escenario {
  display: none; /* Se oculta al principio */
  position: relative;
  width: 100%;
  height: 100%;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* --- ELEMENTOS DE LA TARTA --- */
.cake-wrapper {
  position: relative;
  width: 280px;
  height: 300px;
  display: flex;
  justify-content: center;
  align-items: flex-end; /* Alinear abajo */
}

/* El Plato */
.plate {
  position: absolute;
  bottom: 0;
  width: 280px;
  height: 30px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
  z-index: 1;
}

/* Capas comunes */
.layer {
  position: absolute;
  width: 240px;
  background: linear-gradient(to right, #6d4c41, #5d4037);
  border-radius: 10px;
  opacity: 0; /* Invisibles al inicio */
}

/* Rellenos comunes */
.filling {
  position: absolute;
  width: 230px;
  height: 12px;
  background: #3e2723;
  border-radius: 5px;
  z-index: 4;
  opacity: 0;
}

/* Posiciones específicas (desde abajo hacia arriba) */
#capa1 { height: 50px; bottom: 20px; z-index: 2; }
#relleno1 { bottom: 65px; z-index: 3; }
#capa2 { height: 50px; bottom: 75px; z-index: 4; }
#relleno2 { bottom: 120px; z-index: 5; }
#capa3 { height: 50px; bottom: 130px; z-index: 6; }

/* Crema Blanca */
#crema {
  position: absolute;
  width: 240px;
  height: 40px;
  bottom: 175px;
  background: white;
  border-radius: 15px 15px 10px 10px;
  z-index: 7;
  opacity: 0;
  box-shadow: inset 0 -5px 5px rgba(0,0,0,0.05);
}

/* Vela */
.candle {
  position: absolute;
  bottom: 210px;
  width: 15px;
  height: 50px;
  background: repeating-linear-gradient(45deg, #ffcdd2, #ffcdd2 5px, white 5px, white 10px);
  z-index: 1; /* Detrás de la crema */
  opacity: 0;
}

.flame {
  position: absolute;
  top: -20px;
  left: 0;
  width: 15px;
  height: 20px;
  background: orange;
  border-radius: 50% 50% 20% 20%;
  box-shadow: 0 0 10px orange;
  animation: flicker 0.2s infinite alternate;
}

@keyframes flicker { from { transform: scale(1); } to { transform: scale(1.1); } }

/* Animación de entrada (Caída) */
@keyframes entrada {
  from { transform: translateY(-300px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

@keyframes subirVela {
  from { transform: translateY(50px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

/* Clases para activar animación con JS */
.animar-caida { animation: entrada 0.6s forwards; }
.animar-vela { animation: subirVela 1s forwards; }

/* Texto */
.message {
  margin-top: 40px;
  height: 50px;
  font-size: 28px;
  color: #c2185b;
  font-weight: bold;
  text-align: center;
  font-family: 'Segoe UI', sans-serif;
  text-transform: uppercase;
}
</style>
</head>
<body>

<div id="pantalla-inicio">
  <button onclick="abrirRegalo()">🎁 ABRIR SORPRESA</button>
  <p style="margin-top: 15px; color: #888;">(Sube el volumen)</p>
</div>

<audio id="musica" loop>
  <source src="mucia.mp3" type="audio/mpeg">
</audio>

<div id="escenario">
  <div class="cake-wrapper">
    <div class="plate"></div>
    
    <div id="capa1" class="layer"></div>
    <div id="relleno1" class="filling"></div>
    <div id="capa2" class="layer"></div>
    <div id="relleno2" class="filling"></div>
    <div id="capa3" class="layer"></div>
    <div id="crema"></div>
    
    <div id="vela" class="candle">
      <div class="flame"></div>
    </div>
  </div>
  
  <div class="message" id="texto-final"></div>
</div>

<script>
function abrirRegalo() {
  // 1. Ocultar botón y mostrar escenario (PRIORIDAD VISUAL)
  document.getElementById('pantalla-inicio').style.display = 'none';
  document.getElementById('escenario').style.display = 'flex';

  // 2. Intentar reproducir música (Sin bloquear la animación)
  var audio = document.getElementById('musica');
  audio.play().catch(function(error) {
    console.log("No se pudo reproducir el audio automáticamente: " + error);
    // Si falla, no pasa nada, la tarta sale igual.
  });

  // 3. Lanzar animaciones secuenciales
  // Usamos setTimeout para ir pieza a pieza
  
  // Capa 1 (Base)
  setTimeout(() => document.getElementById('capa1').classList.add('animar-caida'), 100);
  
  // Relleno 1
  setTimeout(() => document.getElementById('relleno1').classList.add('animar-caida'), 600);
  
  // Capa 2
  setTimeout(() => document.getElementById('capa2').classList.add('animar-caida'), 1100);
  
  // Relleno 2
  setTimeout(() => document.getElementById('relleno2').classList.add('animar-caida'), 1600);
  
  // Capa 3
  setTimeout(() => document.getElementById('capa3').classList.add('animar-caida'), 2100);
  
  // Crema
  setTimeout(() => document.getElementById('crema').classList.add('animar-caida'), 2600);
  
  // Vela
  setTimeout(() => document.getElementById('vela').classList.add('animar-vela'), 3200);

  // Texto (Empieza cuando la tarta está casi lista)
  setTimeout(escribirTexto, 3500);
}

// Función de escribir
var mensaje = "Happy birthday my love!";
var i = 0;
var divTexto = document.getElementById('texto-final');

function escribirTexto() {
  if (i < mensaje.length) {
    divTexto.innerHTML += mensaje.charAt(i);
    i++;
    setTimeout(escribirTexto, 100);
  }
}
</script>

</body>
</html>
