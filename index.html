<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday My Love</title>

<style>
/* --- 1. FONDO Y ESCENARIO --- */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background-color: #ffd6e8; /* Rosa claro */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

/* --- 2. BRILLOS (SPARKLES) --- */
.sparkle {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px 2px rgba(255, 255, 255, 0.8);
  opacity: 0;
  pointer-events: none;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(110vh) scale(0); opacity: 0; }
  20% { opacity: 1; transform: translateY(80vh) scale(1); }
  80% { opacity: 1; transform: translateY(20vh) scale(1); }
  100% { transform: translateY(-10vh) scale(0); opacity: 0; }
}

/* --- 3. CONTENEDOR DE LA TARTA --- */
.cake-container {
  position: relative;
  width: 300px;
  height: 400px; /* Espacio suficiente para montar la tarta */
  display: flex;
  flex-direction: column-reverse; /* Construimos de abajo hacia arriba visualmente en CSS */
  align-items: center;
  justify-content: flex-start;
  padding-bottom: 20px;
}

/* --- 4. EL PLATO --- */
.plate {
  width: 320px;
  height: 40px;
  background: #f0f0f0;
  border-radius: 50%;
  box-shadow: 0 10px 15px rgba(0,0,0,0.2);
  position: absolute;
  bottom: 0;
  z-index: 1;
}

/* --- 5. CAPAS DE LA TARTA (General) --- */
.cake-element {
  opacity: 0; /* Invisible al principio */
  animation: bounceIn 0.8s forwards; /* Animación de caída */
}

/* Capa de bizcocho (Marrón) */
.layer {
  width: 250px;
  height: 50px; /* Mismo tamaño */
  background: linear-gradient(to right, #6d4c41, #5d4037, #4e342e);
  border-radius: 10px;
  position: relative;
  z-index: 5;
  margin-bottom: -10px; /* Para que se vea 3D compacta */
  box-shadow: inset 0 5px 10px rgba(0,0,0,0.3);
}

/* Relleno (Chocolate Oscuro) */
.filling {
  width: 240px;
  height: 15px;
  background: #3e2723; /* Chocolate muy oscuro */
  border-radius: 5px;
  margin: -2px 0; /* Pegado entre capas */
  z-index: 4;
}

/* Crema Blanca Superior */
.frosting {
  width: 250px;
  height: 40px;
  background: linear-gradient(to bottom, #ffffff, #ececec);
  border-radius: 15px 15px 10px 10px;
  z-index: 10;
  position: relative;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
}

/* --- 6. LA VELA (Palo de fuego) --- */
.candle {
  width: 14px;
  height: 60px;
  background: repeating-linear-gradient(45deg, #ff9a9e, #ff9a9e 5px, #fff 5px, #fff 10px);
  border-radius: 4px;
  position: absolute;
  bottom: 230px; /* Ajustado según la altura de las capas */
  z-index: 2; /* Detrás de la crema un poco si fuera necesario, pero aquí encima */
  opacity: 0;
  animation: riseCandle 1s forwards;
}

.flame {
  width: 15px;
  height: 25px;
  background: radial-gradient(circle at 50% 80%, #fff000, #ff9900, #ff0000);
  border-radius: 50% 50% 20% 20%;
  position: absolute;
  top: -25px;
  left: 0;
  box-shadow: 0 0 20px #ff9900;
  animation: flicker 0.3s infinite alternate;
}

/* --- 7. ANIMACIONES --- */
/* Animación de "caer" y rebotar un poco (más realista) */
@keyframes bounceIn {
  0% { transform: translateY(-300px); opacity: 0; }
  60% { transform: translateY(10px); opacity: 1; }
  80% { transform: translateY(-5px); }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes riseCandle {
  0% { transform: translateY(50px); opacity: 0; }
  100% { transform: translateY(0); opacity: 1; }
}

@keyframes flicker {
  0% { transform: scale(1); opacity: 0.9; }
  100% { transform: scale(1.2); opacity: 1; }
}

/* TIEMPOS DE ANIMACIÓN (Retrasos para el orden de montaje) */
/* Orden: Plato(static) -> Capa1 -> Relleno1 -> Capa2 -> Relleno2 -> Capa3 -> Crema Blanca -> Vela */

.layer-bottom { animation-delay: 0.5s; z-index: 2; bottom: 20px; position: absolute;}
.filling-1    { animation-delay: 1.0s; z-index: 3; bottom: 60px; position: absolute;}
.layer-middle { animation-delay: 1.5s; z-index: 4; bottom: 70px; position: absolute;}
.filling-2    { animation-delay: 2.0s; z-index: 5; bottom: 110px; position: absolute;}
.layer-top    { animation-delay: 2.5s; z-index: 6; bottom: 120px; position: absolute;}
.frosting     { animation-delay: 3.0s; z-index: 7; bottom: 160px; position: absolute;}
.candle       { animation-delay: 3.8s; z-index: 1; bottom: 190px; position: absolute;} /* La vela sale detrás y sube */

/* --- 8. TEXTO --- */
.message {
  margin-top: 30px;
  font-size: 32px;
  font-weight: bold;
  color: #d81b60;
  text-transform: uppercase;
  letter-spacing: 3px;
  text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.5);
  min-height: 40px;
  text-align: center;
}

</style>
</head>
<body>

<audio id="bgMusic" autoplay loop>
  <source src="mucia.mp3" type="audio/mpeg">
</audio>

<div class="cake-container">
  <div class="plate"></div>

  <div class="cake-element layer layer-bottom"></div>
  
  <div class="cake-element filling filling-1"></div>
  
  <div class="cake-element layer layer-middle"></div>
  
  <div class="cake-element filling filling-2"></div>
  
  <div class="cake-element layer layer-top"></div>
  
  <div class="cake-element frosting"></div>
  
  <div class="candle">
    <div class="flame"></div>
  </div>
</div>

<div class="message" id="text-area"></div>

<script>
// --- 1. Generar Brillos en el fondo ---
function createSparkles() {
  const sparkleCount = 30; // Número de brillos
  for (let i = 0; i < sparkleCount; i++) {
    let div = document.createElement('div');
    div.classList.add('sparkle');
    
    // Posición y tamaño aleatorio
    let x = Math.random() * 100;
    let size = Math.random() * 5 + 2; // entre 2px y 7px
    let delay = Math.random() * 5; 
    let duration = Math.random() * 5 + 5; // entre 5s y 10s
    
    div.style.left = x + 'vw';
    div.style.width = size + 'px';
    div.style.height = size + 'px';
    div.style.animationDelay = delay + 's';
    div.style.animationDuration = duration + 's';
    
    document.body.appendChild(div);
  }
}
createSparkles();

// --- 2. Texto Máquina de Escribir ---
// Empezamos a escribir cuando la tarta ya está casi montada (aprox a los 2.5 segundos)
const fullText = "Happy birthday my love!";
const textContainer = document.getElementById('text-area');
let charIndex = 0;

function typeText() {
  if (charIndex < fullText.length) {
    textContainer.innerHTML += fullText.charAt(charIndex);
    charIndex++;
    setTimeout(typeText, 100); // Velocidad de escritura
  }
}

// Retraso inicial para coordinar con la tarta
setTimeout(typeText, 2500);

// --- Intentar reproducir música si el autoplay falla ---
document.body.addEventListener('click', function() {
    const audio = document.getElementById('bgMusic');
    if (audio.paused) {
        audio.play();
    }
});

</script>

</body>
</html>
