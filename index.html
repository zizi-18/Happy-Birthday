<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body{
  margin:0;
  padding:0;
  width:100vw;
  height:100vh;
  background:#ffd6e8;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  font-family:sans-serif;
}

/* Pantalla inicio */
#pantalla-inicio{
  position:fixed;
  width:100%;
  height:100%;
  background:#ffd6e8;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

button{
  background:#e91e63;
  color:white;
  border:none;
  padding:20px 40px;
  font-size:20px;
  border-radius:50px;
  cursor:pointer;
  animation:palpitar 1s infinite;
}

@keyframes palpitar{
  0%{transform:scale(1);}
  50%{transform:scale(1.08);}
  100%{transform:scale(1);}
}

/* Escenario */
#escenario{
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  position:relative;
}

/* Brillos */
.sparkle{
  position:absolute;
  width:5px;
  height:5px;
  background:white;
  border-radius:50%;
  box-shadow:0 0 15px white;
  animation:flotar 8s linear infinite;
  opacity:0;
}

@keyframes flotar{
  0%{transform:translateY(100vh);opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* Tarta */
.cake-wrapper{
  position:relative;
  width:280px;
  height:320px;
  display:flex;
  justify-content:center;
  align-items:flex-end;
}

.plate{
  position:absolute;
  bottom:0;
  width:280px;
  height:30px;
  background:white;
  border-radius:50%;
}

.layer{
  position:absolute;
  width:240px;
  height:55px;
  background:linear-gradient(to bottom,#6b3a17,#4a260f);
  border-radius:10px;
  opacity:0;
}

.filling{
  position:absolute;
  width:230px;
  height:15px;
  background:#3b1f0f;
  border-radius:6px;
  opacity:0;
}

#capa1{bottom:30px;}
#relleno1{bottom:85px;}
#capa2{bottom:100px;}
#relleno2{bottom:155px;}
#capa3{bottom:170px;}

#crema{
  position:absolute;
  width:240px;
  height:35px;
  bottom:225px;
  background:white;
  border-radius:15px;
  opacity:0;
}

.candle{
  position:absolute;
  bottom:260px;
  width:15px;
  height:50px;
  background:repeating-linear-gradient(
    45deg,#ffcdd2,#ffcdd2 5px,white 5px,white 10px);
  border-radius:4px;
  opacity:0;
}

.flame{
  position:absolute;
  top:-20px;
  width:15px;
  height:20px;
  background:orange;
  border-radius:50%;
  animation:fuego .3s infinite alternate;
  box-shadow:0 0 20px orange;
}

@keyframes fuego{
  from{transform:scale(1);}
  to{transform:scale(1.2);}
}

@keyframes caer{
  from{transform:translateY(-300px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.animar{animation:caer .6s forwards;}

.message{
  margin-top:40px;
  font-size:28px;
  color:#c2185b;
  font-weight:bold;
  text-transform:uppercase;
  height:40px;
}
</style>
</head>

<body>

<div id="pantalla-inicio">
  <button id="btn">🎁 ABRIR SORPRESA</button>
  <p>(Sube el volumen)</p>
</div>

<audio id="musica" preload="auto" src="mucia.mp3"></audio>

<div id="escenario">

  <div class="cake-wrapper">
    <div class="plate"></div>
    <div id="capa1" class="layer"></div>
    <div id="relleno1" class="filling"></div>
    <div id="capa2" class="layer"></div>
    <div id="relleno2" class="filling"></div>
    <div id="capa3" class="layer"></div>
    <div id="crema"></div>
    <div id="vela" class="candle"><div class="flame"></div></div>
  </div>

  <div class="message" id="texto"></div>

</div>

<script>
document.getElementById("btn").addEventListener("click", function(){

  document.getElementById("pantalla-inicio").style.display="none";
  document.getElementById("escenario").style.display="flex";

  const audio=document.getElementById("musica");
  audio.volume=0.8;
  audio.play();

  // Brillos
  setInterval(()=>{
    const s=document.createElement("div");
    s.classList.add("sparkle");
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(Math.random()*5+5)+"s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),8000);
  },250);

  // Montaje
  setTimeout(()=>capa1.classList.add("animar"),200);
  setTimeout(()=>relleno1.classList.add("animar"),700);
  setTimeout(()=>capa2.classList.add("animar"),1200);
  setTimeout(()=>relleno2.classList.add("animar"),1700);
  setTimeout(()=>capa3.classList.add("animar"),2200);
  setTimeout(()=>crema.classList.add("animar"),2700);
  setTimeout(()=>vela.classList.add("animar"),3200);

  setTimeout(escribirTexto,3500);
});

let mensaje="Happy birthday my love!";
let i=0;

function escribirTexto(){
  if(i<mensaje.length){
    document.getElementById("texto").innerHTML+=mensaje.charAt(i);
    i++;
    setTimeout(escribirTexto,90);
  }
}
</script>

</body>
</html>
