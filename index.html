/* --- CONFIGURACIÓN BÁSICA --- */
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  background-color: #ffd6e8; /* Rosa claro */
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: 'Segoe UI', sans-serif;
}

/* --- BOTÓN DE INICIO (ESTILO GIGANTE) --- */
#overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #ffd6e8;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

button {
  padding: 20px 40px;
  font-size: 24px;
  background: #c2185b;
  color: white;
  border: none;
  border-radius: 50px;
  cursor: pointer;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
  animation: latido 1s infinite;
}

@keyframes latido {
  0% { transform: scale(1); }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); }
}

/* --- ESCENARIO DE LA TARTA --- */
.container {
  display: none; /* Se oculta hasta que pulsas el botón */
  position: relative;
  text-align: center;
  width: 100%;
  height: 100%;
  flex-direction: column;
  justify-content: center;
  align-items: center;
}

/* --- BRILLOS --- */
.sparkle {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 10px white;
  opacity: 0;
  animation: flotar 5s linear infinite;
}

@keyframes flotar {
  0% { transform: translateY(100vh); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* --- LA TARTA --- */
.cake-wrapper {
  position: relative;
  width: 300px;
  height: 350px; /* Altura total de la tarta */
  margin: 0 auto;
}

.plate {
  width: 300px;
  height: 30px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  position: absolute;
  bottom: 0;
  left: 0;
}

/* Estilos comunes de capas */
.layer, .filling, .cream-top {
  position: absolute;
  left: 25px; /* Centrado respecto al plato de 300px (300-250)/2 */
  width: 250px;
  opacity: 0; /* Invisible al inicio */
}

/* Capa Marrón */
.layer {
  height: 50px;
  background: linear-gradient(to right, #6b3a17, #4a260f);
  border-radius: 10px;
  z-index: 5;
}

/* Relleno Chocolate */
.filling {
  height: 15px;
  width: 240px; /* Un poco más metido */
  left: 30px;
  background: #2a140a;
  border-radius: 5px;
  z-index: 4;
}

/* Crema Blanca Arriba */
.cream-top {
  height: 40px;
  background: linear-gradient(to bottom, #ffffff, #f0f0f0);
  border-radius: 15px 15px 10px 10px;
  z-index: 10;
  box-shadow: 0 5px 5px rgba(0,0,0,0.1);
}
